[project]
name = "yam-tui"
dynamic = ["version"]
description = "Minimal TUI for controlling a Yamaha RX-V475 AV receiver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "René Fritze", email = "coding@fritze.me" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console :: Curses",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/renefritze/yam-tui"

[project.scripts]
yam-tui = "yam_tui.app:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/yam_tui/_version.py"
